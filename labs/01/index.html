<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Curso de HTML5 da disciplina de Programacao WEB">
    <title>Curso HTML5</title>
</head>
<body>
    <header>
        <h1>Área de Contato do Cliente</h1>
        <nav>
            <a href="#">Ajuda</a> | <a href="#">Sair</a>
        </nav>
    </header>

    <main>
        <article>
        <h2>Envie sua mensagem para a nossa equipe de suporte backend</h2>
        
        <form action="/enviar" method="POST">
            <label for="nome">Nome: </label>
            <input type="text" id="nome" name="nome" minlength="5" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" minlength="20" required><br><br>

            <label for="celular">Telefone Celular:</label>
            <input type="text" id="celular" name="celular" pattern="[0-9]{11}" required><br><br>

            <label for="msg">Mensagem:</label>
            <textarea id="msg" name="msg"></textarea><br><br>

            <input type="button"  value="Disparar Dados">
        </form>
        </article>
    </main>

    <footer>
        Suporte Tech 2026
    </footer>
</body>
</html>
